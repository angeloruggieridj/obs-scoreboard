  <rect class="btn" x="164" y="150" width="157" height="28" rx="4"/><text class="t c b" x="242" y="168">STILLWATER</text>
  <!-- goals -->
  <text class="t c b" x="81" y="198">Goal</text><text class="t c b" x="242" y="198">Goal</text>
