  <rect class="score" x="53" y="204" width="54" height="30" rx="4"/><text class="sv" x="80" y="225">2</text>
  <rect class="btn" x="109" y="204" width="51" height="30" rx="4"/><text class="t c" x="134" y="223">+1</text>
  <rect class="btn" x="164" y="204" width="48" height="30" rx="4"/><text class="t c" x="188" y="223">&#8722;1</text>
  <rect class="score" x="214" y="204" width="54" height="30" rx="4"/><text class="sv" x="241" y="225">1</text>
  <rect class="btn" x="270" y="204" width="51" height="30" rx="4"/><text class="t c" x="295" y="223">+1</text>
  <!-- shots -->
  <text class="t c b" x="81" y="256">Shots</text><text class="t c b" x="242" y="256">Shots</text>
  <rect class="btn" x="3" y="262" width="48" height="30" rx="4"/><text class="t c" x="27" y="281">&#8722;1</text>
  <text class="t c b" x="80" y="282">14</text>
  <rect class="btn" x="109" y="262" width="51" height="30" rx="4"/><text class="t c" x="134" y="281">+1</text>
  <rect class="btn" x="164" y="262" width="48" height="30" rx="4"/><text class="t c" x="188" y="281">&#8722;1</text>
  <text class="t c b" x="241" y="282">9</text>
  <rect class="btn" x="270" y="262" width="51" height="30" rx="4"/><text class="t c" x="295" y="281">+1</text>
  <!-- penalties -->
  <text class="t b" x="40" y="318">Penalties</text><rect class="btn" x="136" y="304" width="24" height="20" rx="4"/><text class="t c b" x="148" y="319">+</text>
  <text class="t b" x="200" y="318">Penalties</text><rect class="btn" x="296" y="304" width="24" height="20" rx="4"/><text class="t c b" x="308" y="319">+</text>
  <rect class="pen" x="3" y="330" width="157" height="24" rx="3"/><text class="t b" x="9" y="346">#24</text><text class="t" x="44" y="346">1:32</text><text class="t m" x="84" y="346">edit</text><text class="t m" x="140" y="346">X</text>
  <rect class="pen" x="3" y="358" width="157" height="24" rx="3"/><text class="t b" x="9" y="374">#7</text><text class="t m" x="44" y="374">queued 2:00</text>
  <rect class="pen" x="164" y="330" width="157" height="24" rx="3"/><text class="t b" x="170" y="346">#11</text><text class="t" x="205" y="346">0:48</text><text class="t m" x="245" y="346">edit</text><text class="t m" x="301" y="346">X</text>
  <text class="t m c" x="162" y="402">Strength 5-4</text>
  <rect x="9" y="410" width="12" height="12" rx="2" fill="#3d6fe0"/><text class="t" x="28" y="420">Count down</text>
