<svg xmlns="http://www.w3.org/2000/svg" width="324" height="430" viewBox="0 0 324 430" role="img" aria-label="ScoreBoard dock during an ice hockey match: clock 14:32, score 2-1, shots, two timed penalties">
  <title>ScoreBoard dock - ice hockey, match in progress (illustration)</title>
  <style>
    .bg{fill:#1e1f22}.bar{fill:#2a2c31}.btn{fill:#3a3d44}.t{font-family:Segoe UI,Arial,sans-serif;font-size:11px;fill:#e8e9ec}
    .b{font-weight:700}.m{fill:#9aa0ab;font-size:10px}.c{text-anchor:middle}.clock{font-family:Consolas,'Courier New',monospace;font-size:46px;font-weight:700;fill:#f4f4f4;text-anchor:middle}
    .go{fill:#27ae60}.stop{fill:#c0392b}.score{fill:#f2c94c}.sv{fill:#1e1f22;font-family:Segoe UI,Arial,sans-serif;font-weight:700;font-size:15px;text-anchor:middle}
    .pen{fill:#2a2c31}.q{fill:#ef7d57}
  </style>
  <rect class="bg" width="324" height="430" rx="4"/>
  <rect class="bar" width="324" height="24"/>
  <text class="t b" x="9" y="16">ScoreBoard</text>
  <!-- clock block -->
  <rect class="btn" x="3" y="34" width="60" height="30" rx="4"/><text class="t c" x="33" y="53">+1:00</text>
  <rect class="btn" x="3" y="70" width="60" height="30" rx="4"/><text class="t c" x="33" y="89">-1:00</text>
  <text class="clock" x="163" y="85">14:32</text>
  <rect class="btn" x="244" y="34" width="60" height="30" rx="4"/><text class="t c" x="274" y="53">+0:01</text>
  <rect class="btn" x="244" y="70" width="60" height="30" rx="4"/><text class="t c" x="274" y="89">-0:01</text>
  <text class="t m" x="196" y="104">&#9679; 14/28</text>
  <!-- period + start -->
  <rect class="btn" x="3" y="112" width="26" height="28" rx="4"/><text class="t c b" x="16" y="130">-</text>
  <text class="t c b" x="41" y="130">2</text>
  <rect class="btn" x="52" y="112" width="26" height="28" rx="4"/><text class="t c b" x="65" y="130">+</text>
  <text class="t m" x="84" y="130">of 3</text>
  <rect class="stop" x="118" y="112" width="128" height="28" rx="4"/><text class="t c b" x="182" y="130" style="fill:#fff">Stop</text>
  <rect class="btn" x="252" y="112" width="68" height="28" rx="4"/><text class="t c" x="286" y="130">Reset</text>
