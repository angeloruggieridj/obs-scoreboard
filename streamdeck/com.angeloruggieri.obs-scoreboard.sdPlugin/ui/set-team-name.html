<!doctype html>
<html>
  <head lang="en">
    <title>obs-scoreboard — Set Team Name</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Team">
      <sdpi-select setting="team" default="home">
        <option value="home">Home</option>
        <option value="away">Away</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Name">
      <sdpi-textfield setting="name" default=""></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
