<!doctype html>
<html>
  <head lang="en">
    <title>obs-scoreboard — Stat</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Team">
      <sdpi-select setting="team" default="home">
        <option value="home">Home</option>
        <option value="away">Away</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Stat">
      <sdpi-select setting="stat" default="shots">
        <option value="score">Score</option>
        <option value="shots">Shots</option>
        <option value="fouls">Fouls</option>
        <option value="fouls2">Second fouls</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Delta">
      <sdpi-textfield setting="delta" type="number" default="1"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
