<!doctype html>
<html>
  <head lang="en">
    <title>obs-scoreboard — New Match</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Sport">
      <sdpi-textfield setting="sport" default="ice_hockey"></sdpi-textfield>
    </sdpi-item>
    <!-- Tick Confirmed to replace a match that is already in progress (the key alerts otherwise). -->
    <sdpi-item label="Confirmed">
      <sdpi-checkbox setting="confirmed" default="false"></sdpi-checkbox>
    </sdpi-item>
  </body>
</html>
