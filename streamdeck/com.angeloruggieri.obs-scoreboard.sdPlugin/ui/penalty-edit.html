<!doctype html>
<html>
  <head lang="en">
    <title>obs-scoreboard — Edit Penalty</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <!-- The id comes from GetState (the penalty rows the panel shows); tenths is the new time. -->
    <sdpi-item label="Id">
      <sdpi-textfield setting="id" type="number" default="0"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Tenths">
      <sdpi-textfield setting="tenths" type="number" default="0"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
