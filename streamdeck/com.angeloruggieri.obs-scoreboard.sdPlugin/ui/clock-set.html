<!doctype html>
<html>
  <head lang="en">
    <title>obs-scoreboard — Set Clock</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <!-- Absolute minutes/seconds; the plugin converts them to tenths for ClockSet. -->
    <sdpi-item label="Minutes">
      <sdpi-textfield setting="minutes" type="number" default="0"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Seconds">
      <sdpi-textfield setting="seconds" type="number" default="0"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
