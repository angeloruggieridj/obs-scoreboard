<!doctype html>
<html>
  <head lang="en">
    <title>obs-scoreboard — Cancel Running Penalty</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Team">
      <sdpi-select setting="team" default="home">
        <option value="home">Home</option>
        <option value="away">Away</option>
      </sdpi-select>
    </sdpi-item>
    <!-- 0 cancels the first running penalty, 1 the second. -->
    <sdpi-item label="Slot">
      <sdpi-textfield setting="slot" type="number" default="0"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
