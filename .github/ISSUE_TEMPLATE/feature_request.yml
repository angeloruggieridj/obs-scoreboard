name: Feature request
description: Suggest an improvement or a new sport
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: The situation you are in (sport, stream setup) matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you imagine it working, if you have one.
