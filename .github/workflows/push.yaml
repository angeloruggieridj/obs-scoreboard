name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    # contents: write publishes the release; the other two let this job mint a
    # build provenance attestation for every asset, signed with an OIDC token.
    # None of the packages are code-signed by default -- the attestation is
    # what replaces a publisher signature.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Optional. Without it the VirusTotal steps below are skipped, not
      # failed, and the release still publishes.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      # THE TAG AND THE BINARY HAVE TO AGREE ON WHAT THIS BUILD IS.
      #
      # The plugin reports buildspec's `version` + `prerelease` (see
      # PLUGIN_VERSION_FULL in CMakeLists.txt); the release is named by the tag.
      # The release name must match the version the plugin reports in the OBS
      # log, so they are compared here, and a release whose tag disagrees is
      # not published at all.
      - name: Check Out Sources 📥
        if: github.ref_type == 'tag'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Tag Matches buildspec 🧾
        if: github.ref_type == 'tag'
        id: buildspec
        run: |
          : Check Tag Matches buildspec 🧾
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          version="$(jq -r '.version' buildspec.json)"
          pre="$(jq -r '.prerelease // ""' buildspec.json)"
          declared="${version}"
          [[ -n "${pre}" ]] && declared="${version}-${pre}"

          if [[ "${GITHUB_REF_NAME}" != "${declared}" ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match the version this build reports ('${declared}'). Update buildspec.json's version/prerelease, or retag."
            exit 1
          fi
          echo "tag and buildspec agree on ${declared}"
          # The asset names carry `version` alone, never the prerelease suffix
          # (a 1.0.1-beta1 build ships obs-scoreboard-1.0.1-windows-x64.zip).
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      # None of the packages are code-signed by default, so ship something
      # people can check instead: an attestation binding every asset to this
      # workflow, this commit and this runner. The version comes from
      # buildspec, matching exactly what the Rename Files step moved into the
      # workspace -- a per-extension glob would fail on *.exe, which a
      # macOS/Linux-only run has no asset for.
      - name: Attest build provenance 🔏
        if: fromJSON(steps.check.outputs.validTag)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ github.workspace }}/obs-scoreboard-${{ steps.buildspec.outputs.version }}-*

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

      # An independent second opinion, linked from the release page. Needs a
      # free VirusTotal API key in the VT_API_KEY secret; without one both
      # steps are skipped and the release still publishes.
      - name: Scan the packages with VirusTotal 🧬
        id: vt
        if: fromJSON(steps.check.outputs.validTag) && env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          # Everything an operator runs or installs: the Windows zip, the
          # macOS package, the Ubuntu .deb. Not the source tarball or the
          # debug symbols, which nobody executes.
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb

      # softprops' own update_release_body only fires on a "release" event and
      # this workflow runs on a tag push, so append the reports here instead.
      # This lands AFTER the "### Checksums" block written above.
      - name: Link the VirusTotal reports from the release 🔗
        if: steps.vt.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          : Link the VirusTotal reports from the release 🔗
          {
            echo ''
            echo '### Verification'
            echo ''
            echo '- **Integrity** — compare each asset against the SHA-256 in `### Checksums` above.'
            echo "- **Provenance** — \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
            echo '- **VirusTotal** —'
            IFS=',' read -ra rows <<< "${ANALYSIS}"
            for row in "${rows[@]}"; do
              echo "  - [$(basename "${row%%=*}")](${row#*=})"
            done
          } >> ${{ github.workspace }}/CHECKSUMS.txt
          gh release edit "${GITHUB_REF_NAME}" --notes-file ${{ github.workspace }}/CHECKSUMS.txt
